name: Deploy DADSync v9 (exact bytes)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch exact DADSync v9 index.html (95,610 bytes, MD5 bef2f1572f15bd8c41adbb6b1071ea64)
        run: |
          curl -fsSL -o index.html \
            "https://static.teamily.ai/sites/666879b5-b597-4dbd-bde5-617ae780deb7/webpages/dadsync_v9/index.html?tk=c2l0ZTo2NjY4NzliNS1iNTk3LTRkYmQtYmRlNS02MTdhZTc4MGRlYjcvd2VicGFnZXMvZGFkc3luY192OToxNzg2MzgxMDE0.NjBmYzQzMDFjZjM4YWNhODkwNTU3ZTBlMzIyM2Y5NWE"
          md5sum index.html

      - name: Verify exactness (fail build if file differs)
        run: |
          set -e
          test "$(stat -c%s index.html)" = "95610"
          [ "$(md5sum index.html | cut -d' ' -f1)" = "bef2f1572f15bd8c41adbb6b1071ea64" ] || { echo "index.html mismatch"; exit 1; }
          echo "All files verified exact."

      - name: Commit and push exact file
        run: |
          git config user.name "DADSync Deploy Bot"
          git config user.email "deploy@dadsync.in"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit";
          else
            git commit -m "Deploy DADSync v9 (exact 95610B, MD5 bef2f157): email-forwarded contact + careers forms"
            git push origin main
          fi
