name: Deploy DADSync v13 (exact bytes)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch exact DADSync v13 index.html (97,630 bytes, MD5 a3bd63c78df44e5fdb088218f201f43c)
        run: |
          curl -fsSL -o index.html \
            "https://static.teamily.ai/sites/f7a7b3c1-7bdd-4e6b-b470-77e29d31da07/webpages/dadsync_v13/index.html?tk=c2l0ZTpmN2E3YjNjMS03YmRkLTRlNmItYjQ3MC03N2UyOWQzMWRhMDcvd2VicGFnZXMvZGFkc3luY192MTM6MTc4Njg5Njg2Mw.NjUzY2Q5ODY2ZDU1NmRmYmYxNGU2OWI2NmE0NmE2ZWM"
          md5sum index.html

      - name: Fetch exact DADSync v13 tripura-ai.css (24,166 bytes, MD5 95a421816c71710c60118450e937eed2)
        run: |
          curl -fsSL -o tripura-ai.css \
            "https://static.teamily.ai/sites/f7a7b3c1-7bdd-4e6b-b470-77e29d31da07/webpages/dadsync_v13/tripura-ai.css?tk=c2l0ZTpmN2E3YjNjMS03YmRkLTRlNmItYjQ3MC03N2UyOWQzMWRhMDcvd2VicGFnZXMvZGFkc3luY192MTM6MTc4Njg5Njg2Mw.NjUzY2Q5ODY2ZDU1NmRmYmYxNGU2OWI2NmE0NmE2ZWM"
          md5sum tripura-ai.css

      - name: Fetch exact DADSync v13 tads-data.js (61,807 bytes, MD5 a1be0fe37507e03a2a4d492b926a3024)
        run: |
          curl -fsSL -o tads-data.js \
            "https://static.teamily.ai/sites/f7a7b3c1-7bdd-4e6b-b470-77e29d31da07/webpages/dadsync_v13/tads-data.js?tk=c2l0ZTpmN2E3YjNjMS03YmRkLTRlNmItYjQ3MC03N2UyOWQzMWRhMDcvd2VicGFnZXMvZGFkc3luY192MTM6MTc4Njg5Njg2Mw.NjUzY2Q5ODY2ZDU1NmRmYmYxNGU2OWI2NmE0NmE2ZWM"
          md5sum tads-data.js

      - name: Fetch exact DADSync v13 tads-app.js (77,825 bytes, MD5 c0c15e3d648b49ccaa4f7b50fc365c4d)
        run: |
          curl -fsSL -o tads-app.js \
            "https://static.teamily.ai/sites/f7a7b3c1-7bdd-4e6b-b470-77e29d31da07/webpages/dadsync_v13/tads-app.js?tk=c2l0ZTpmN2E3YjNjMS03YmRkLTRlNmItYjQ3MC03N2UyOWQzMWRhMDcvd2VicGFnZXMvZGFkc3luY192MTM6MTc4Njg5Njg2Mw.NjUzY2Q5ODY2ZDU1NmRmYmYxNGU2OWI2NmE0NmE2ZWM"
          md5sum tads-app.js

      - name: Verify exactness (fail build if any file differs)
        run: |
          set -e
          test "$(stat -c%s index.html)" = "97630"
          [ "$(md5sum index.html | cut -d' ' -f1)" = "a3bd63c78df44e5fdb088218f201f43c" ] || { echo "index.html mismatch"; exit 1; }
          test "$(stat -c%s tripura-ai.css)" = "24166"
          [ "$(md5sum tripura-ai.css | cut -d' ' -f1)" = "95a421816c71710c60118450e937eed2" ] || { echo "tripura-ai.css mismatch"; exit 1; }
          test "$(stat -c%s tads-data.js)" = "61807"
          [ "$(md5sum tads-data.js | cut -d' ' -f1)" = "a1be0fe37507e03a2a4d492b926a3024" ] || { echo "tads-data.js mismatch"; exit 1; }
          test "$(stat -c%s tads-app.js)" = "77825"
          [ "$(md5sum tads-app.js | cut -d' ' -f1)" = "c0c15e3d648b49ccaa4f7b50fc365c4d" ] || { echo "tads-app.js mismatch"; exit 1; }
          echo "All files verified exact."

      - name: Commit and push exact files
        run: |
          git config user.name "DADsync Deploy Bot"
          git config user.email "deploy@dadsync.in"
          git add index.html tripura-ai.css tads-data.js tads-app.js
          if git diff --cached --quiet; then
            echo "No changes to commit";
          else
            git commit -m "Deploy DADSync v13 (exact 97630B, MD5 a3bd63c78df44e5fdb088218f201f43c): Tripura AI Transformation module (governance, funding, problems, opportunities, knowledge, dashboard, admin)"
            git push origin main
          fi
