name: Deploy DADSync v10 (exact bytes)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch exact DADSync v10 index.html (110,474 bytes, MD5 08db8faa72343cf3a9fdcbfb3dcf2a55)
        run: |
          curl -fsSL -o index.html \
            "https://static.teamily.ai/sites/666879b5-b597-4dbd-bde5-617ae780deb7/webpages/dadsync_v10/index.html?tk=c2l0ZTo2NjY4NzliNS1iNTk3LTRkYmQtYmRlNS02MTdhZTc4MGRlYjcvd2VicGFnZXMvZGFkc3luY192MTA6MTc4NjU0NDY4Ng.MTIyMjVhYWMzMjI3NjA1NDQwZDUwZjY4YWQ1M2ZmNDA"
          md5sum index.html

      - name: Verify exactness (fail build if file differs)
        run: |
          set -e
          test "$(stat -c%s index.html)" = "110474"
          [ "$(md5sum index.html | cut -d' ' -f1)" = "08db8faa72343cf3a9fdcbfb3dcf2a55" ] || { echo "index.html mismatch"; exit 1; }
          echo "All files verified exact."

      - name: Commit and push exact file
        run: |
          git config user.name "DADSync Deploy Bot"
          git config user.email "deploy@dadsync.in"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit";
          else
            git commit -m "Deploy DADSync v10 (exact 110474B, MD5 08db8faa): MindPal AI assistant + FAQ widget"
            git push origin main
          fi
