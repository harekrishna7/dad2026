name: Deploy DADSync v20 Dify Chatbot (exact bytes)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch exact v20 pages with Dify chatbot embed (14 files)
        run: |
          curl -fsSL -o index.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/index.html"
          echo "index.html: $(stat -c%s index.html) bytes, $(md5sum index.html | cut -d" " -f1)"
          curl -fsSL -o about.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/about.html"
          echo "about.html: $(stat -c%s about.html) bytes, $(md5sum about.html | cut -d" " -f1)"
          curl -fsSL -o services.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/services.html"
          echo "services.html: $(stat -c%s services.html) bytes, $(md5sum services.html | cut -d" " -f1)"
          curl -fsSL -o industries.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/industries.html"
          echo "industries.html: $(stat -c%s industries.html) bytes, $(md5sum industries.html | cut -d" " -f1)"
          curl -fsSL -o careers.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/careers.html"
          echo "careers.html: $(stat -c%s careers.html) bytes, $(md5sum careers.html | cut -d" " -f1)"
          curl -fsSL -o contact.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/contact.html"
          echo "contact.html: $(stat -c%s contact.html) bytes, $(md5sum contact.html | cut -d" " -f1)"
          curl -fsSL -o hub.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/hub.html"
          echo "hub.html: $(stat -c%s hub.html) bytes, $(md5sum hub.html | cut -d" " -f1)"
          curl -fsSL -o investors.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/investors.html"
          echo "investors.html: $(stat -c%s investors.html) bytes, $(md5sum investors.html | cut -d" " -f1)"
          curl -fsSL -o news.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/news.html"
          echo "news.html: $(stat -c%s news.html) bytes, $(md5sum news.html | cut -d" " -f1)"
          curl -fsSL -o privacy.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/privacy.html"
          echo "privacy.html: $(stat -c%s privacy.html) bytes, $(md5sum privacy.html | cut -d" " -f1)"
          curl -fsSL -o terms.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/terms.html"
          echo "terms.html: $(stat -c%s terms.html) bytes, $(md5sum terms.html | cut -d" " -f1)"
          curl -fsSL -o 404.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/404.html"
          echo "404.html: $(stat -c%s 404.html) bytes, $(md5sum 404.html | cut -d" " -f1)"
          curl -fsSL -o connection.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/connection.html"
          echo "connection.html: $(stat -c%s connection.html) bytes, $(md5sum connection.html | cut -d" " -f1)"
          curl -fsSL -o agency-agents.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v20/agency-agents.html"
          echo "agency-agents.html: $(stat -c%s agency-agents.html) bytes, $(md5sum agency-agents.html | cut -d" " -f1)"

      - name: Verify exactness (fail build if any file differs)
        run: |
          set -e
          test "$(stat -c%s index.html)" = "104386" || { echo "index.html size mismatch"; exit 1; }
          [ "$(md5sum index.html | cut -d" " -f1)" = "ead041446e0513d2128c07f8360b5be9" ] || { echo "index.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s about.html)" = "17118" || { echo "about.html size mismatch"; exit 1; }
          [ "$(md5sum about.html | cut -d" " -f1)" = "9528235a9713bd458c9c8a88a993a684" ] || { echo "about.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s services.html)" = "20634" || { echo "services.html size mismatch"; exit 1; }
          [ "$(md5sum services.html | cut -d" " -f1)" = "72e51113712ba96ad81109533e4507dc" ] || { echo "services.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s industries.html)" = "15286" || { echo "industries.html size mismatch"; exit 1; }
          [ "$(md5sum industries.html | cut -d" " -f1)" = "cbe1d20d97bafbde296c964e43d56b34" ] || { echo "industries.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s careers.html)" = "21714" || { echo "careers.html size mismatch"; exit 1; }
          [ "$(md5sum careers.html | cut -d" " -f1)" = "f55ef79aff9946f7fa8897a94640227b" ] || { echo "careers.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s contact.html)" = "26133" || { echo "contact.html size mismatch"; exit 1; }
          [ "$(md5sum contact.html | cut -d" " -f1)" = "c18d43d1a4b09caef034d2351a58dfc4" ] || { echo "contact.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s hub.html)" = "17337" || { echo "hub.html size mismatch"; exit 1; }
          [ "$(md5sum hub.html | cut -d" " -f1)" = "f9d5e7aea5a6d3a2f7c746d6f335ba40" ] || { echo "hub.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s investors.html)" = "19645" || { echo "investors.html size mismatch"; exit 1; }
          [ "$(md5sum investors.html | cut -d" " -f1)" = "78f6e1ba121311d5b0aaa3733b7a0b9b" ] || { echo "investors.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s news.html)" = "20580" || { echo "news.html size mismatch"; exit 1; }
          [ "$(md5sum news.html | cut -d" " -f1)" = "5b445b74efb949645058ef43945a88af" ] || { echo "news.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s privacy.html)" = "13983" || { echo "privacy.html size mismatch"; exit 1; }
          [ "$(md5sum privacy.html | cut -d" " -f1)" = "db00a0f2d0b91e45c0c3ed84076b9c0a" ] || { echo "privacy.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s terms.html)" = "14167" || { echo "terms.html size mismatch"; exit 1; }
          [ "$(md5sum terms.html | cut -d" " -f1)" = "3cb6e221e4cfeafa7fc01ecf92ef89c4" ] || { echo "terms.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s 404.html)" = "3883" || { echo "404.html size mismatch"; exit 1; }
          [ "$(md5sum 404.html | cut -d" " -f1)" = "47a0b5e93287ee8d3f043a797dacb6e7" ] || { echo "404.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s connection.html)" = "33697" || { echo "connection.html size mismatch"; exit 1; }
          [ "$(md5sum connection.html | cut -d" " -f1)" = "7db4c2d1a512949c16b7692e263076c2" ] || { echo "connection.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s agency-agents.html)" = "33608" || { echo "agency-agents.html size mismatch"; exit 1; }
          [ "$(md5sum agency-agents.html | cut -d" " -f1)" = "568eaaad30841f3f61feb4cbbf607525" ] || { echo "agency-agents.html MD5 mismatch"; exit 1; }
          echo "All 14 files verified exact."

      - name: Commit and push exact pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "DADsync Deploy Bot"
          git config user.email "deploy@dadsync.in"
          git add index.html about.html services.html industries.html careers.html contact.html hub.html investors.html news.html privacy.html terms.html 404.html connection.html agency-agents.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git commit -m "Deploy v20: integrate Dify AI chatbot embed with real app token (app-i5a3R2bfu0OBYa3l4xTtfbHb) site-wide - 14 pages, exact bytes (MD5 verified)"
            git push origin main
          fi