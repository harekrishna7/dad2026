name: Deploy DADSync v23 Add Koro Chat (exact bytes)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch exact v23 pages (15 files, Koro chat added)
        run: |
          curl -fsSL -o koro.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/koro.html"
          echo "koro.html: $(stat -c%s koro.html) bytes, $(md5sum koro.html | cut -d" " -f1)"
          curl -fsSL -o about.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/about.html"
          echo "about.html: $(stat -c%s about.html) bytes, $(md5sum about.html | cut -d" " -f1)"
          curl -fsSL -o careers.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/careers.html"
          echo "careers.html: $(stat -c%s careers.html) bytes, $(md5sum careers.html | cut -d" " -f1)"
          curl -fsSL -o contact.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/contact.html"
          echo "contact.html: $(stat -c%s contact.html) bytes, $(md5sum contact.html | cut -d" " -f1)"
          curl -fsSL -o hub.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/hub.html"
          echo "hub.html: $(stat -c%s hub.html) bytes, $(md5sum hub.html | cut -d" " -f1)"
          curl -fsSL -o industries.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/industries.html"
          echo "industries.html: $(stat -c%s industries.html) bytes, $(md5sum industries.html | cut -d" " -f1)"
          curl -fsSL -o investors.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/investors.html"
          echo "investors.html: $(stat -c%s investors.html) bytes, $(md5sum investors.html | cut -d" " -f1)"
          curl -fsSL -o news.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/news.html"
          echo "news.html: $(stat -c%s news.html) bytes, $(md5sum news.html | cut -d" " -f1)"
          curl -fsSL -o privacy.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/privacy.html"
          echo "privacy.html: $(stat -c%s privacy.html) bytes, $(md5sum privacy.html | cut -d" " -f1)"
          curl -fsSL -o services.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/services.html"
          echo "services.html: $(stat -c%s services.html) bytes, $(md5sum services.html | cut -d" " -f1)"
          curl -fsSL -o terms.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/terms.html"
          echo "terms.html: $(stat -c%s terms.html) bytes, $(md5sum terms.html | cut -d" " -f1)"
          curl -fsSL -o connection.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/connection.html"
          echo "connection.html: $(stat -c%s connection.html) bytes, $(md5sum connection.html | cut -d" " -f1)"
          curl -fsSL -o index.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/index.html"
          echo "index.html: $(stat -c%s index.html) bytes, $(md5sum index.html | cut -d" " -f1)"
          curl -fsSL -o 404.html \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/404.html"
          echo "404.html: $(stat -c%s 404.html) bytes, $(md5sum 404.html | cut -d" " -f1)"
          curl -fsSL -o sitemap.xml \
            "https://static.teamily.ai/sites/77759200-3a04-402a-80a3-1c1ed69376ab/documents/dadsync-ghpages-deploy-v23/sitemap.xml"
          echo "sitemap.xml: $(stat -c%s sitemap.xml) bytes, $(md5sum sitemap.xml | cut -d" " -f1)"

      - name: Verify exactness (fail build if any file differs)
        run: |
          set -e
          test "$(stat -c%s koro.html)" = "12827" || { echo "koro.html size mismatch"; exit 1; }
          [ "$(md5sum koro.html | cut -d" " -f1)" = "d6b0d52b5374c77cbbccf637265c63a4" ] || { echo "koro.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s about.html)" = "17398" || { echo "about.html size mismatch"; exit 1; }
          [ "$(md5sum about.html | cut -d" " -f1)" = "87d20db0c85c9703c661780326d736fb" ] || { echo "about.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s careers.html)" = "21994" || { echo "careers.html size mismatch"; exit 1; }
          [ "$(md5sum careers.html | cut -d" " -f1)" = "5fa8c5979f60815a8ef7aca7e9c5af0b" ] || { echo "careers.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s contact.html)" = "26413" || { echo "contact.html size mismatch"; exit 1; }
          [ "$(md5sum contact.html | cut -d" " -f1)" = "196423c2ba7c3aa0d4afb347b95b1659" ] || { echo "contact.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s hub.html)" = "17617" || { echo "hub.html size mismatch"; exit 1; }
          [ "$(md5sum hub.html | cut -d" " -f1)" = "22136cfd20467131c9d2958a87a7894c" ] || { echo "hub.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s industries.html)" = "15566" || { echo "industries.html size mismatch"; exit 1; }
          [ "$(md5sum industries.html | cut -d" " -f1)" = "4445495f988c9df9812296e7901986ff" ] || { echo "industries.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s investors.html)" = "19925" || { echo "investors.html size mismatch"; exit 1; }
          [ "$(md5sum investors.html | cut -d" " -f1)" = "d1ac79655b0827a6e15caee6337f1717" ] || { echo "investors.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s news.html)" = "20860" || { echo "news.html size mismatch"; exit 1; }
          [ "$(md5sum news.html | cut -d" " -f1)" = "7e489d7337d9274359d7a5e4ce1b4152" ] || { echo "news.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s privacy.html)" = "14263" || { echo "privacy.html size mismatch"; exit 1; }
          [ "$(md5sum privacy.html | cut -d" " -f1)" = "3cadecc7b9c6801c83e46372fb9e12a3" ] || { echo "privacy.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s services.html)" = "20914" || { echo "services.html size mismatch"; exit 1; }
          [ "$(md5sum services.html | cut -d" " -f1)" = "813cc2629cbd67c8dd0ec99640679459" ] || { echo "services.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s terms.html)" = "14447" || { echo "terms.html size mismatch"; exit 1; }
          [ "$(md5sum terms.html | cut -d" " -f1)" = "1003b94f36f5e1d7d6c451e5b2687c04" ] || { echo "terms.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s connection.html)" = "33977" || { echo "connection.html size mismatch"; exit 1; }
          [ "$(md5sum connection.html | cut -d" " -f1)" = "79f1369c876b77858a3b548666fd69d8" ] || { echo "connection.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s index.html)" = "99137" || { echo "index.html size mismatch"; exit 1; }
          [ "$(md5sum index.html | cut -d" " -f1)" = "1f6979f3b3a9110ba87c90cb5e063984" ] || { echo "index.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s 404.html)" = "3865" || { echo "404.html size mismatch"; exit 1; }
          [ "$(md5sum 404.html | cut -d" " -f1)" = "7e701a517fb418585e7dd0ea68ab4f38" ] || { echo "404.html MD5 mismatch"; exit 1; }
          test "$(stat -c%s sitemap.xml)" = "1714" || { echo "sitemap.xml size mismatch"; exit 1; }
          [ "$(md5sum sitemap.xml | cut -d" " -f1)" = "e957381da69e75e69ef87c5a3e4450a4" ] || { echo "sitemap.xml MD5 mismatch"; exit 1; }
          echo "All 15 files verified exact."

      - name: Commit and push exact pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "DADsync Deploy Bot"
          git config user.email "deploy@dadsync.in"
          git add koro.html about.html careers.html contact.html hub.html industries.html investors.html news.html privacy.html services.html terms.html connection.html index.html 404.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git commit -m "Deploy v23: add Koro AI chat (koro.html embedding freemodels.pro iframe) + Koro nav links site-wide, update sitemap & 404 routes - 15 files, exact bytes (MD5 verified), AI Chat kept intact"
            git push origin main
          fi