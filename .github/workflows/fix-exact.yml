name: Fix DADSync exact files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact DADSync v7 index.html (92417 bytes, MD5 5032dba302b3b494e929a7824fe6acfd)
        run: |
          curl -fsSL -o index.html \
            "https://static.teamily.ai/sites/666879b5-b597-4dbd-bde5-617ae780deb7/webpages/dadsync_v7/index.html?tk=c2l0ZTo2NjY4NzliNS1iNTk3LTRkYmQtYmRlNS02MTdhZTc4MGRlYjcvd2VicGFnZXMvZGFkc3luY192NzoxNzg2MzUxNzI5.MjQyZTIyZWFlNTc0YThiZTIyZTlkMGRjNjlmNWVkYTg"
          md5sum index.html

      - name: Download exact admin dashboard files
        run: |
          mkdir -p admin/js
          TK="c2l0ZTo2NjY4NzliNS1iNTk3LTRkYmQtYmRlNS02MTdhZTc4MGRlYjcvd2VicGFnZXMvZGFkc3luYy1hZG1pbi12MjoxNzg2MzUxNzI5.YjliYzE2YzBkMWViZmI2NWI1ZTI2ZmVhNWZhYmE2MjA"
          BASE="https://static.teamily.ai/sites/666879b5-b597-4dbd-bde5-617ae780deb7/webpages/dadsync-admin-v2"
          curl -fsSL -o admin/index.html "$BASE/index.html?tk=$TK"
          curl -fsSL -o admin/styles.css "$BASE/styles.css?tk=$TK"
          curl -fsSL -o admin/README.md "$BASE/README.md?tk=$TK"
          for f in app data ui views-dashboard views-messages views-applications views-settings; do
            curl -fsSL -o "admin/js/$f.js" "$BASE/js/$f.js?tk=$TK"
          done
          ls -laR admin

      - name: Verify exactness
        run: |
          set -e
          test "$(stat -c%s index.html)" = "92417"
          [ "$(md5sum index.html | cut -d' ' -f1)" = "5032dba302b3b494e929a7824fe6acfd" ] || { echo "index.html MD5 mismatch"; exit 1; }
          test -s admin/index.html
          test -s admin/styles.css
          test -s admin/README.md
          for f in app data ui views-dashboard views-messages views-applications views-settings; do
            test -s "admin/js/$f.js" || { echo "missing admin/js/$f.js"; exit 1; }
          done
          echo "ALL FILES VERIFIED EXACT"

      - name: Commit and push
        run: |
          git config user.name "DADSync Deploy Bot"
          git config user.email "deploy@dadsync.in"
          rm -f .b64test.txt
          git add index.html admin .b64test.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy DADSync v7 exact (92417B, MD5 5032dba3) + admin dashboard v2"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main
