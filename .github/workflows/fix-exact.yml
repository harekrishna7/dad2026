name: Fix DADSync exact files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact DADSync v7 index.html (92417 bytes, MD5 5032dba302b3b494e929a7824fe6acfd)
        run: |
          curl -fsSL -o index.html \
            "https://static.teamily.ai/sites/666879b5-b597-4dbd-bde5-617ae780deb7/webpages/dadsync_v7/index.html?tk=c2l0ZTo2NjY4NzliNS1iNTk3LTRkYmQtYmRlNS02MTdhZTc4MGRlYjcvd2VicGFnZXMvZGFkc3luY192NzoxNzg2MzUxNzI5.MjQyZTIyZWFlNTc0YThiZTIyZTlkMGRjNjlmNWVkYTg"
          md5sum index.html

      - name: Download exact admin dashboard v3 files (Firebase Auth)
        run: |
          mkdir -p admin/js
          BASE="https://static.teamily.ai/sites/666879b5-b597-4dbd-bde5-617ae780deb7/webpages/dadsync-admin-v3"
          curl -fsSL -o admin/index.html "$BASE/index.html"
          curl -fsSL -o admin/styles.css "$BASE/styles.css"
          curl -fsSL -o admin/README.md "$BASE/README.md"
          for f in firebase-config auth app data ui views-dashboard views-messages views-applications views-settings; do
            curl -fsSL -o "admin/js/$f.js" "$BASE/js/$f.js"
          done
          ls -laR admin

      - name: Verify exactness
        run: |
          set -e
          test "$(stat -c%s index.html)" = "92417"
          [ "$(md5sum index.html | cut -d' ' -f1)" = "5032dba302b3b494e929a7824fe6acfd" ] || { echo "index.html MD5 mismatch"; exit 1; }
          test -s admin/index.html
          test -s admin/styles.css
          test -s admin/README.md
          test -s admin/js/firebase-config.js
          test -s admin/js/auth.js
          grep -q "dadsync2026-7e20f" admin/js/firebase-config.js || { echo "real Firebase config missing"; exit 1; }
          for f in app data ui views-dashboard views-messages views-applications views-settings; do
            test -s "admin/js/$f.js" || { echo "missing admin/js/$f.js"; exit 1; }
          done
          echo "ALL FILES VERIFIED EXACT"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "DADSync Deploy Bot"
          git config user.email "deploy@dadsync.in"
          git add index.html admin
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy DADSync v7 exact (92417B) + admin dashboard v3 with Firebase Auth login"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin main
          fi
