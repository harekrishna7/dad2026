<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | DADsync</title>
  <meta name="description" content="The page you are looking for could not be found. Return to the DADsync homepage." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0b5ed7" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="DADsync home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>
        </span>
        <span class="brand-name"><b>DADsync</b><small>Dharmanagar Ai Datasync Pvt. Ltd.</small></span>
      </a>
    </div>
  </header>
  <main class="error-page">
    <div>
      <div class="code">404</div>
      <h1>This page could not be found</h1>
      <p>We recently upgraded the site — the page you are looking for may have moved.</p>
      <div class="hero-ctas" style="justify-content:center">
        <a class="btn btn-primary" href="index.html">Back to Home</a>
        <a class="btn btn-secondary" href="contact.html">Contact Us</a>
      </div>
    </div>
  </main>
  <script>
    // GitHub Pages SPA fallback: map clean URLs (/about, /investors, ...)
    // to their .html files so deep links never 404 on refresh/direct load/share.
    // Unknown paths stay on this friendly 404 page.  (fix: deep links -> 404)
    (function () {
      var ROUTES = {
        '': 'index.html', 'index.html': 'index.html',
        'about': 'about.html', 'services': 'services.html', 'hub': 'hub.html',
        'connection': 'connection.html',
        'industries': 'industries.html', 'careers': 'careers.html',
        'investors': 'investors.html', 'contact': 'contact.html',
        'news': 'news.html',
        'privacy': 'privacy.html', 'terms': 'terms.html'
      };
      try {
        var path = window.location.pathname.replace(/\/+$/, '');
        var seg = path.substring(path.lastIndexOf('/') + 1);
        var target = ROUTES[seg];
        if (target && window.location.pathname.indexOf('/' + seg) !== -1) {
          window.location.replace(target);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
