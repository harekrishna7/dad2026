<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DADsync Admin — Website Inbox & Applications</title>
<meta name="description" content="DADsync Admin Dashboard — manage website contact messages and job applications for dadsync.in. Demo mode included; connect a backend (e.g. Firebase) for live submissions.">

<body>

<!-- ============ DADSync Admin v2: Firebase Realtime Database (optional) ============
     To read live submissions, fill in the FIREBASE_CONFIG placeholders below with your
     Firebase project values (see README.md). The same project/config used by the main
     website (dadsync_v7) must be used here so the dashboard reads the same nodes:
       - contact_messages   (written by the website Contact form)
       - job_applications   (written by the website Careers forms)
     If left as placeholders, the dashboard gracefully falls back to the built-in
     localStorage demo data so it still works standalone.
     Alternatively paste the config in Settings -> Firebase in the UI (persisted to
     localStorage, dadsync_admin_config_v2) -- it overrides these constants. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* DADSync Admin v2 - Firebase Realtime Database config (fill in to enable).
   SAME config as the dadsync_v7 website so both read/write the same database. */
var FIREBASE_CONFIG = {
  apiKey: 'YOUR_FIREBASE_API_KEY',
  authDomain: 'YOUR_PROJECT_ID.firebaseapp.com',
  databaseURL: 'https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com',
  projectId: 'YOUR_PROJECT_ID',
  storageBucket: 'YOUR_PROJECT_ID.appspot.com',
  messagingSenderId: 'YOUR_MESSAGING_SENDER_ID',
  appId: 'YOUR_FIREBASE_APP_ID'
};
var FIREBASE_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('YOUR_') === -1 && FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.indexOf('YOUR_') === -1);
</script>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="login-screen" class="login-screen">
  <div class="login-bg-grid"></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">D</div>
      <div class="login-brand-text">
        <div class="login-brand-name">DADsync</div>
        <div class="login-brand-sub">Admin Dashboard</div>
      </div>
    </div>
    <form id="login-form" autocomplete="off">
      <label class="field-label" for="login-email">Email</label>
      <input class="field" id="login-email" type="email" placeholder="owner@dadsync.in" required>
      <label class="field-label" for="login-password">Password</label>
      <input class="field" id="login-password" type="password" placeholder="••••••••" required>
      <button class="btn btn-primary btn-block" id="login-submit" type="submit">Sign in</button>
    </form>
    <div class="login-divider"><span>or</span></div>
    <button class="btn btn-ghost btn-block" id="demo-login" type="button">
      <span class="demo-dot"></span> Explore with demo data
    </button>
    <div class="login-note" id="login-note"></div>
    <div class="login-brand-foot">
      <span class="muted-sm">DADsync · Cloud-first AI infrastructure &amp; data intelligence</span>
    </div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="app-shell hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="main" id="main"></main>
  </div>
</div>

<!-- ===================== MODAL ROOT ===================== -->
<div class="modal-root" id="modal-root"></div>

<!-- ===================== TOASTS ===================== -->
<div class="toast-root" id="toast-root"></div>

<!-- ===================== APP MODULES ===================== -->
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/views-dashboard.js"></script>
<script src="js/views-messages.js"></script>
<script src="js/views-applications.js"></script>
<script src="js/views-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
